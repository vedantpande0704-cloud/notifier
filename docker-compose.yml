version: '3.8'

services:
  opennotify:
    build: .
    container_name: opennotify-engine
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=change_me_in_production_jwt_secret_key_32_chars
      - DATABASE_TYPE=sqlite
      - SQLITE_DB_PATH=/app/data/opennotify.db
      - MAIL_PROVIDER=dev
      - SMS_PROVIDER=dev
      - WHATSAPP_PROVIDER=dev
    volumes:
      - opennotify-data:/app/data

volumes:
  opennotify-data:
    driver: local
